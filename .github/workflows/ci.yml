name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    # Linux on Anvil's runners (anvil-4cpu: the ffmpeg export tests timed out on small runners), except for pull
    # requests from forks, which stay on GitHub's so code from outside the repository never runs on Anvil's server.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork && 'anvil-4cpu' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static downloads the ffmpeg for this runner's OS during install.
      # xmllint checks the exported FCPXML and MLT (built into macOS).
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-Typecheck and tests (${{ matrix.os }})
          path: junit.xml
          if-no-files-found: warn
