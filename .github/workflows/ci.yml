name: CI

on:
  pull_request:
  # main, and the batches Anvil's merge queue pushes to anvil/queue/<n> (ci-ok on the batch head decides the merge).
  push:
    branches: [main, "anvil/queue/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    # Linux on Anvil's runners (anvil-4cpu: the ffmpeg export tests timed out on small runners), except for pull
    # requests from forks, which stay on GitHub's so code from outside the repository never runs on Anvil's server.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork && 'anvil-4cpu' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static downloads the ffmpeg for this runner's OS during install.
      # xmllint checks the exported FCPXML and MLT (built into macOS).
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      # --testTimeout: the CPU-bound tracker tests (test/tracker.test.ts) take 5.3–5.6 s on anvil-4cpu, just over
      # vitest's 5 s default.
      - run: npx vitest run --testTimeout=20000 --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-Typecheck and tests (${{ matrix.os }})
          path: junit.xml
          if-no-files-found: warn

  # The one check the merge queue and branch protection need: fails when any job failed or was cancelled, passes when
  # they all succeeded or were skipped.
  ci-ok:
    name: ci-ok
    needs: [test]
    if: always()
    runs-on: anvil-2cpu
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::a CI job failed or was cancelled"
            exit 1
          fi
